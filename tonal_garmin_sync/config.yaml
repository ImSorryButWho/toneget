name: Tonal to Garmin Sync
version: "0.1.2"
slug: tonal_garmin_sync
description: Adds Tonal set, rep and weight data to your Garmin strength workouts.
url: https://github.com/ImSorryButWho/toneget
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
options:
  tonal_email: ""
  tonal_password: ""
  garmin_email: ""
  garmin_password: ""
  garmin_mfa_code: ""
  interval_minutes: 10
  tonal_lookback: 5
  dry_run: true
schema:
  tonal_email: email
  tonal_password: password
  garmin_email: email
  garmin_password: password
  garmin_mfa_code: str?
  interval_minutes: int(5,1440)
  tonal_lookback: int(1,30)
  dry_run: bool
